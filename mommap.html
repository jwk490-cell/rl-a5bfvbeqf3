*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);

.wrap{max-width:1180px;margin:0 auto;padding:24px}
h1{font-size:25px;font-weight:800;margin:0 0 4px}
.sub{color:var(--sub);font-size:14px;margin-bottom:6px}
.meta{color:var(--sub);font-size:12.5px}.meta b{color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 12px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{appearance:none;background:none;border:0;color:var(--sub);font:inherit;font-size:13px;font-weight:700;

.seg button.on{background:var(--panel2);color:var(--ink)}
.chk{font-size:12.5px;color:var(--sub);display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.brief{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--impr);
border-radius:10px;padding:13px 17px;margin:0 0 14px;font-size:13px;color:var(--sub);line-height:1.75}
.brief b{color:var(--ink)}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.mhead{padding:13px 18px;border-bottom:1px solid var(--line);font-size:14px;font-weight:800}
.mhead small{font-size:11.5px;color:var(--sub);font-weight:600;margin-left:8px}
svg{display:block;width:100%;height:auto;touch-action:manipulation}
svg text{font-family:inherit}
.pt{cursor:pointer}.pt circle{transition:r .12s}
.dimmed .pt:not(.hl){opacity:.18}
.tip{position:absolute;pointer-events:none;background:#0b0d11;border:1px solid var(--line);border-radius:9px;
padding:8px 11px;font-size:12px;line-height:1.6;white-space:nowrap;display:none;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.tip b{font-size:12.5px}.tip .s{color:var(--sub)}
.quads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.q h3{margin:0;padding:11px 15px;font-size:13.5px;font-weight:800;border-bottom:1px solid var(--line)}
.q h3 small{color:var(--sub);font-weight:600;font-size:11.5px;margin-left:6px}
.q table{width:100%;border-collapse:collapse}
.q th{font-size:11px;color:var(--sub);text-align:right;padding:7px 12px;font-weight:700;border-bottom:1px solid var(--line)}
.q td{font-size:12.5px;text-align:right;padding:6px 12px;border-bottom:1px solid #20242e;font-variant-numeric:tabular-nums;white-space:nowrap}
.q th:first-child,.q td:first-child{text-align:left;white-space:normal}
.q tr:last-child td{border-bottom:0}.q tbody tr:hover td{background:rgba(255,255,255,.03)}
.q .nm{color:var(--sub);font-size:11.5px;margin-left:6px}
.q .none{padding:16px;text-align:center;color:var(--sub);font-size:12.5px}
.up{color:#e0606a}.dn{color:#5a9bd8}
.formula{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);
border-radius:10px;padding:13px 16px;font-size:13px;color:var(--sub);margin:22px 0 0;line-height:1.7}
.formula b{color:var(--ink)}
.foot{color:var(--sub);font-size:11.5px;margin-top:22px;border-top:1px solid var(--line);padding-top:14px;line-height:1.7}
@media(max-width:720px){.wrap{padding:16px}.quads{grid-template-columns:minmax(0,1fr)}.q .nm{display:none}}

  const corner=(q,x,y,a)=>`<text x="${x}" y="${y}" fill="${QC[q]}" font-size="${fs+2}" font-weight="800" text-anchor="${a}">${QN[q]} ${cnt[q]}</text>`;
  s+=corner('impr',P.l+8,P.t+16,'start')+corner('lead',W-P.r-8,P.t+16,'end')+corner('lag',P.l+8,H-P.b-10,'start')+corner('weak',W-P.r-8,H-P.b-10,'end');
  // 라벨 충돌 회피: 벤치마크에서 먼 점부터 오른쪽→왼쪽→위→아래 순으로 자리 탐색, 실패 시 숨김(호버로 확인)
  const boxes=rows.map(r=>({x0:X(r.r3)-R-1,x1:X(r.r3)+R+1,y0:Y(r.r1)-R-1,y1:Y(r.r1)+R+1}));
  boxes.push({x0:bx-9,x1:bx+9,y0:byy-9,y1:byy+9});
  const hit=b=>b.x0<P.l||b.x1>W-P.r||b.y0<P.t||b.y1>H-P.b||boxes.some(o=>b.x0<o.x1&&b.x1>o.x0&&b.y0<o.y1&&b.y1>o.y0);
  const tw=t=>[...t].reduce((a,c)=>a+(c.charCodeAt(0)>255?fs*.95:fs*.6),0)+2;
  const order=rows.map((r,i)=>i).sort((a,b)=>Math.hypot(rows[b].r3-M.b3,(rows[b].r1-M.b1)*2)-Math.hypot(rows[a].r3-M.b3,(rows[a].r1-M.b1)*2));
  const lab={};
  order.forEach(i=>{const r=rows[i],cx=X(r.r3),cy=Y(r.r1),w=tw(r.lb),h=fs+2;
    const cand=[{x:cx+R+5,y:cy+4,a:'start',b:{x0:cx+R+4,x1:cx+R+5+w,y0:cy-h/2,y1:cy+h/2}},
                {x:cx-R-5,y:cy+4,a:'end',b:{x0:cx-R-5-w,x1:cx-R-4,y0:cy-h/2,y1:cy+h/2}},
                {x:cx,y:cy-R-5,a:'middle',b:{x0:cx-w/2,x1:cx+w/2,y0:cy-R-4-h,y1:cy-R-3}},
                {x:cx,y:cy+R+h,a:'middle',b:{x0:cx-w/2,x1:cx+w/2,y0:cy+R+3,y1:cy+R+4+h}}];
    const c=cand.find(c=>!hit(c.b));
    if(c){lab[i]=c;boxes.push(c.b)}else if(allLb)lab[i]=cand[0];});
  rows.forEach((r,i)=>{const c=lab[i];
    s+=`<g class="pt" data-i="${i}"><circle cx="${X(r.r3)}" cy="${Y(r.r1)}" r="${R}" fill="${QC[r.q]}" stroke="#171a21" stroke-width="1.5"/>`+
      `<circle cx="${X(r.r3)}" cy="${Y(r.r1)}" r="13" fill="transparent"/>`+
      (c?`<text x="${c.x}" y="${c.y}" fill="#cfd5df" font-size="${fs}" font-weight="600" text-anchor="${c.a}">${esc(r.lb)}</text>`:'')+`</g>`});
  s+=`<path d="M${bx} ${byy-9}L${bx+9} ${byy}L${bx} ${byy+9}L${bx-9} ${byy}Z" fill="#e9ecf1" stroke="#171a21" stroke-width="1.5"/></svg>`;
  host.innerHTML=s;
  const tip=document.getElementById('tip'),card=host.parentElement,svg=host.firstChild;
  function show(g){const r=rows[+g.dataset.i];svg.classList.add('dimmed');g.classList.add('hl');
    tip.innerHTML=`<b style="color:${QC[r.q]}">${QN[r.q]}</b> <b>${esc(r.lb)}</b><br><span class="s">${esc(r.tk)} · ${esc(r.nm)}</span><br>`+
      `3개월 <b class="${cls(r.r3)}">${pct(r.r3)}</b> <span class="s">(시장 대비 ${pct(r.r3-M.b3)}p)</span><br>`+
      `1개월 <b class="${cls(r.r1)}">${pct(r.r1)}</b> <span class="s">(시장 대비 ${pct(r.r1-M.b1)}p)</span>`;
    tip.style.display='block';
    const cb=card.getBoundingClientRect(),gb=g.firstChild.getBoundingClientRect();
    let l=gb.right-cb.left+10,t=gb.top-cb.top-10;
    if(l+tip.offsetWidth>cb.width-6)l=gb.left-cb.left-tip.offsetWidth-10;
    tip.style.left=Math.max(6,l)+'px';tip.style.top=Math.max(6,Math.min(t,cb.height-tip.offsetHeight-6))+'px';}
  function hide(){svg.classList.remove('dimmed');svg.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));tip.style.display='none'}
  svg.querySelectorAll('.pt').forEach(g=>{g.addEventListener('mouseenter',()=>show(g));g.addEventListener('mouseleave',hide);
    g.addEventListener('click',e=>{e.stopPropagation();hide();show(g)})});
  svg.addEventListener('click',hide);
  // ── 4분면 표 ──
  const sorters={lead:(a,b)=>(b.r1-M.b1+b.r3-M.b3)-(a.r1-M.b1+a.r3-M.b3),impr:(a,b)=>b.r1-a.r1,weak:(a,b)=>a.r1-b.r1,lag:(a,b)=>(a.r1+a.r3)-(b.r1+b.r3)};
  document.getElementById('quads').innerHTML=['impr','lead','lag','weak'].map(q=>{const l=by(q).sort(sorters[q]);
    return `<div class="q"><h3 style="color:${QC[q]}">${QN[q]} ${l.length}<small>${QD[q]}</small></h3>`+(l.length?
      `<table><thead><tr><th>ETF</th><th>3개월</th><th>1개월</th></tr></thead><tbody>`+l.map(r=>
      `<tr><td><b>${esc(r.lb)}</b><span class="nm">${esc(mkt==='us'?r.nm:r.tk)}</span></td><td class="${cls(r.r3)}">${pct(r.r3)}</td><td class="${cls(r.r1)}">${pct(r.r1)}</td></tr>`).join('')+`</tbody></table>`
      :`<div class="none">해당 없음</div>`)+`</div>`}).join('');
  document.getElementById('foot').innerHTML=`유니버스: ${mkt==='us'?'미국 상장':'국내 상장'} 섹터·산업·테마 ETF ${rows.length}종 (레버리지·인버스 제외) · 매 거래일 장 마감 후 자동 갱신${mkt==='us'?' (전일 미국 세션 종가)':''}<br>
  분배금 미반영 주가 기준. 겹치는 라벨은 자동으로 숨기며 점에 마우스를 올리면(모바일은 탭) 확인할 수 있다. 투자 판단의 참고 자료일 뿐 특정 종목의 매수·매도 추천이 아닙니다.`;
}
document.querySelectorAll('#mk button').forEach(b=>b.onclick=()=>{mkt=b.dataset.v;try{localStorage.setItem('mommap-mkt',mkt)}catch(e){}render()});
document.getElementById('allLb').onchange=e=>{allLb=e.target.checked;try{localStorage.setItem('mommap-lb',allLb?'1':'0')}catch(e){}render()};
render();
let rsT,lastW=document.getElementById('chart').clientWidth;
window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{const w=document.getElementById('chart').clientWidth;
  if(w&&(w<620)!==(lastW<620)||!lastW){lastW=w;render()}},200)});
</script></body></html>
