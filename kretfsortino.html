<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--ink:#e9ecf1;--sub:#a4adbd;--line:#2a2f3a;
--gold:#e6b93f;--teal:#5db4a4;--red:#e0606a;--green:#5cbf8a;--blue:#5a9bd8;--purple:#a98fd6;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font-family:'Pretendard','Malgun Gothic',-apple-system,sans-serif;letter-spacing:-.01em}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:24px;font-weight:800;margin:0 0 4px}
h2{font-size:16px;font-weight:800;margin:28px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2 small{font-size:11.5px;color:var(--sub);font-weight:500}
.meta{color:var(--sub);font-size:12.5px}.meta b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0 4px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:0}
.stat .lbl{font-size:11.5px;color:var(--sub);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .val{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .val small{font-size:12px;color:var(--sub);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--sub);font:inherit;font-size:12.5px;font-weight:700;padding:6px 13px;cursor:pointer}
.seg button.on{background:var(--gold);color:#14151a}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scroll{overflow:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;color:var(--sub);text-align:right;padding:8px 9px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{font-size:12.5px;text-align:right;padding:7px 9px;border-bottom:1px solid #20242e;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.03)}
/* 일자별 상위 20 */
#hist td,#hist th{text-align:center;font-size:11.5px;padding:7px 8px;min-width:92px;white-space:normal;line-height:1.3}
#hist th:first-child,#hist td:first-child{position:sticky;left:0;background:var(--panel);min-width:78px;white-space:nowrap;font-weight:700;color:var(--sub);z-index:1}
#hist td.none{color:#4a5060}
#hist td.new{color:var(--gold);font-weight:700}
#hist td.st{color:var(--teal)}
#hist tr.today td{background:rgba(230,185,63,.06)}
#hist tr.today td:first-child{color:var(--ink)}
/* 전체 순위 */
#rank th{cursor:pointer;user-select:none}
#rank th.sorted{color:var(--gold)}
#rank th:nth-child(1),#rank td:nth-child(1){text-align:center;width:38px;color:var(--sub)}
#rank th:nth-child(2),#rank td:nth-child(2){text-align:left}
.nm{font-weight:700}.cd{color:var(--sub);font-size:10.5px;margin-left:6px;font-weight:500}
.tag{font-size:10px;color:var(--teal);border:1px solid var(--teal);border-radius:5px;padding:0 4px;margin-left:6px}
.pos{color:var(--red)}.neg{color:var(--blue)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#333946}
.dot.on{background:var(--green)}
.sbar{display:inline-block;height:7px;border-radius:4px;background:linear-gradient(90deg,var(--gold),#f0d27a);vertical-align:1px;margin-left:7px}
.sbar.ng{background:#3a4660}
.rsb{display:inline-block;min-width:30px;border-radius:6px;padding:1px 6px;font-weight:700;text-align:center}
.rk{font-size:10.5px;margin-left:5px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.cardc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.cardc .ct{font-size:13px;font-weight:800;margin-bottom:2px}
.cardc .cs{font-size:11.5px;color:var(--sub);margin-bottom:8px}
svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.expl{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:14px 17px;font-size:12.5px;color:var(--sub);line-height:1.8;margin-top:30px}
.expl b{color:var(--ink)}.expl p{margin:0 0 7px}.expl p:last-child{margin:0}
@media(max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:minmax(0,1fr)}.hidemb{display:none}}

    const prev=H[ri+1]?new Set(H[ri+1].l):null;
    h+='<tr'+(ri===0?' class="today"':'')+'><td>'+row.d+'</td>';
    for(let i=0;i<D.topn;i++){
      const c=row.l[i];
      if(!c){h+='<td class="none">None</td>';continue;}
      const isNew=prev&&!prev.has(c);
      h+='<td class="'+(isNew?'new':(stset.has(c)?'st':''))+'">'+(NM[c]||c)+'</td>';
    }
    h+='</tr>';
  });
  $('hist').innerHTML=h+'</tbody>';
  const m=MAS.find(x=>x.k===curK);
  $('histnote').textContent='종가가 '+m.l+' 위인 종목만 · 노란색 = 전일 목록에 없던 신규 진입';
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.k===curK));
}
$('seg').innerHTML=MAS.slice().reverse().map(m=>'<button data-k="'+m.k+'">'+m.l+' 이상</button>').join('');
$('seg').onclick=e=>{const k=e.target.dataset.k;if(k){curK=k;drawHist();}};
drawHist();

/* 이평선 위 종목 수 추이 */
(function(){
  const B=D.breadth,W=600,H=230,PL=30,PR=8,PT=10,PB=22,n=B.dates.length;
  const mx=Math.max(...B.tot), x=i=>PL+i/(n-1)*(W-PL-PR), y=v=>PT+(1-v/mx)*(H-PT-PB);
  let s='<svg viewBox="0 0 '+W+' '+H+'">';
  for(let g=0;g<=4;g++){const v=Math.round(mx*g/4);s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(PL-5)+'" y="'+(y(v)+3)+'" fill="var(--sub)" font-size="10" text-anchor="end">'+v+'</text>';}
  [0,Math.floor(n/3),Math.floor(n*2/3),n-1].forEach((i,j)=>{s+='<text x="'+x(i)+'" y="'+(H-6)+'" fill="var(--sub)" font-size="10" text-anchor="'+(j===0?'start':j===3?'end':'middle')+'">'+B.dates[i].slice(2)+'</text>';});
  [['d10','var(--gold)'],['d20','var(--teal)'],['w10','var(--purple)']].forEach(([k,c])=>{
    s+='<polyline fill="none" stroke="'+c+'" stroke-width="1.8" points="'+B[k].map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')+'"/>';
    s+='<circle cx="'+x(n-1)+'" cy="'+y(B[k][n-1])+'" r="3" fill="'+c+'"/>';});
  $('brchart').innerHTML=s+'</svg>';
  $('brsub').textContent='최근 '+n+'거래일 · 전체 '+B.tot[n-1]+'종 중 종가가 각 이평선 위에 있는 종목 수';
})();

/* 상대강도 × 소르티노 산점도 */
(function(){
  const R=D.rows,W=600,H=230,PL=34,PR=10,PT=10,PB=24;
  const ys=R.map(r=>r.sor), lo=Math.min(0,...ys), hi=Math.max(...ys);
  const x=v=>PL+v/100*(W-PL-PR), y=v=>PT+(hi-v)/((hi-lo)||1)*(H-PT-PB);
  let s='<svg viewBox="0 0 '+W+' '+H+'">';
  s+='<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--line)"/>';
  s+='<line x1="'+x(70)+'" x2="'+x(70)+'" y1="'+PT+'" y2="'+(H-PB)+'" stroke="var(--line)" stroke-dasharray="3 3"/><text x="'+(x(70)+3)+'" y="'+(PT+9)+'" fill="var(--sub)" font-size="9.5">RS 70</text>';
  [0,25,50,75,100].forEach(v=>{s+='<text x="'+x(v)+'" y="'+(H-8)+'" fill="var(--sub)" font-size="10" text-anchor="middle">'+v+'</text>';});
  [lo,(lo+hi)/2,hi].forEach(v=>{s+='<text x="'+(PL-5)+'" y="'+(y(v)+3)+'" fill="var(--sub)" font-size="10" text-anchor="end">'+v.toFixed(1)+'</text>';});
  R.forEach(r=>{s+='<circle cx="'+x(r.rs).toFixed(1)+'" cy="'+y(r.sor).toFixed(1)+'" r="4" fill="'+(r.w10?'var(--green)':'#6b7385')+'" fill-opacity=".8"><title>'+r.n+' · RS '+r.rs+' · 소르티노 '+r.sor+'</title></circle>';});
  R.slice(0,6).forEach((r,i)=>{s+='<text x="'+(x(r.rs)-6).toFixed(1)+'" y="'+(y(r.sor)+3+(i%2?9:0)).toFixed(1)+'" fill="var(--ink)" font-size="9.5" text-anchor="end">'+r.n+'</text>';});
  $('scatter').innerHTML=s+'</svg>';
})();

/* 전체 순위표 */
const COLS=[['#',null],['종목','n'],['소르티노','sor'],['6M 수익률','r6'],['하방편차','dn'],['상대강도','rs'],['코스피 대비','ex'],['1일','d1'],['1주','w1'],['1개월','m1'],['10일선','d10'],['20일선','d20'],['10주선','w10']];
let sk='sor',sd=-1;
function drawRank(){
  const R=D.rows.slice().sort((a,b)=>{const x=a[sk],y=b[sk];if(typeof x==='string')return sd*x.localeCompare(y);return sd*((x??-1e9)-(y??-1e9));});
  const mx=Math.max(...D.rows.map(r=>Math.abs(r.sor)));
  const rank={};D.rows.forEach((r,i)=>rank[r.c]=i+1);
  let h='<thead><tr>'+COLS.map(([l,k],i)=>'<th data-k="'+(k||'')+'" class="'+(k===sk?'sorted':'')+(i>=7&&i<=9?' hidemb':'')+'">'+l+(k===sk?(sd<0?' ▼':' ▲'):'')+'</th>').join('')+'</tr></thead><tbody>';
  R.forEach(r=>{
    const rk=r.rk5?('<span class="rk '+(r.rk5>0?'pos':'neg')+'">'+(r.rk5>0?'▲':'▼')+Math.abs(r.rk5)+'</span>'):'';
    const hue=r.rs>=70?'rgba(224,96,106,'+(0.18+(r.rs-70)/30*0.42).toFixed(2)+')':r.rs<=30?'rgba(90,155,216,'+(0.18+(30-r.rs)/30*0.42).toFixed(2)+')':'rgba(255,255,255,.05)';
    h+='<tr><td>'+rank[r.c]+rk+'</td><td><span class="nm">'+r.n+'</span>'+(r.st?'<span class="tag">종목</span>':'')+'<span class="cd hidemb">'+r.c+'</span></td>'
      +'<td><b>'+r.sor.toFixed(2)+'</b><span class="sbar'+(r.sor<0?' ng':'')+'" style="width:'+(Math.abs(r.sor)/mx*70).toFixed(0)+'px"></span></td>'
      +'<td class="'+cls(r.r6)+'">'+sg(r.r6)+'%</td><td>'+r.dn+'%</td>'
      +'<td><span class="rsb" style="background:'+hue+'">'+r.rs+'</span></td>'
      +'<td class="'+cls(r.ex)+'">'+sg(r.ex)+'%p</td>'
      +['d1','w1','m1'].map(k=>'<td class="hidemb '+cls(r[k])+'">'+sg(r[k])+(r[k]==null?'':'%')+'</td>').join('')
      +['d10','d20','w10'].map(k=>'<td style="text-align:center"><span class="dot'+(r[k]?' on':'')+'"></span></td>').join('')+'</tr>';
  });
  $('rank').innerHTML=h+'</tbody>';
}
$('rank').onclick=e=>{const th=e.target.closest('th');if(!th||!th.dataset.k)return;const k=th.dataset.k;if(k===sk)sd=-sd;else{sk=k;sd=k==='n'?1:-1;}drawRank();};
drawRank();

$('expl').innerHTML='<p><b>소르티노</b> = 6개월(126거래일) 수익률 ÷ 같은 기간 하방표준편차. 하방표준편차는 하락한 날의 일수익률만으로 계산한 변동성(126일 환산)이라, 오를 때의 변동은 감점하지 않는다. 많이 오르면서 빠질 때 덜 빠진 종목이 위로 온다.</p>'
+'<p><b>상위 20 · 일자별</b> — 그날 종가가 10일선 / 20일선 / 10주선(50일) 위에 있는 종목만 남겨 소르티노 순으로 20칸을 채운다. 조건을 충족한 종목이 20개에 못 미치면 남는 칸은 None. None이 많을수록 추세가 살아 있는 섹터가 적다는 뜻이다.</p>'
+'<p><b>상대강도</b> = 유니버스 안에서 6개월 수익률의 백분위(1~99). <b>코스피 대비</b> = 6개월 수익률 − 코스피 6개월 수익률(%p).</p>'
+'<p>유니버스는 국내 섹터·테마 ETF(해외지수·레버리지·인버스·채권·배당전략 제외)에 삼성전자·SK하이닉스를 더한 '+D.total+'종. 가격은 분배금 반영 수정종가. 평일 장 마감 후 갱신.</p>';
</script></body></html>
