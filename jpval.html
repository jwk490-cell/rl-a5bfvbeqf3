<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日 밸류에이션 · 가이던스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<script>
(function(){var t="dark";try{t=localStorage.getItem("rl-theme")||"dark";}catch(e){}if(t==="dark")document.documentElement.classList.add("dark");})();
</script>
<style>
:root{
  --bg:#f2f4f6; --surface:#ffffff; --surface2:#f2f4f6; --line:#e7eaee; --line2:#eef0f3;
  --text:#191f28; --sub:#4e5968; --faint:#8b95a1;
  --accent:#3168f0; --accent-soft:rgba(49,104,240,.08); --accent-line:rgba(49,104,240,.28);
  --up:#e34948; --down:#2a78d6; --warn:#c98500; --shadow:0 1px 3px rgba(25,31,40,.04); --bar:#3168f0; --bar-e:#9db8f7; --bar-n:#e34948;
}
html.dark{
  --bg:#101014; --surface:#1a1b20; --surface2:#232530; --line:#272930; --line2:#232530;
  --text:#e9ebee; --sub:#9aa2ad; --faint:#6d7480;
  --accent:#4d7df5; --accent-soft:rgba(77,125,245,.14); --accent-line:rgba(77,125,245,.4);
  --up:#e66767; --down:#3987e5; --warn:#e0a640; --shadow:0 1px 3px rgba(0,0,0,.3); --bar:#4d7df5; --bar-e:#2f4a86; --bar-n:#8a3a3a;
}
*{box-sizing:border-box;margin:0;padding:0}
*,*::before,*::after{font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;padding:20px 22px 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--sub);font-size:12px;margin-top:3px}.sub b{color:var(--text)}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h2{font-size:14.5px;font-weight:800;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.card h2 small{font-size:11.5px;font-weight:500;color:var(--faint)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .k{font-size:11px;color:var(--faint);font-weight:700}
.kpi .v{font-size:17px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--sub);margin-top:1px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button,select,input{border:1px solid var(--line);background:var(--surface);color:var(--sub);font:inherit;font-size:12.5px;font-weight:600;height:32px;padding:0 10px;border-radius:9px}
.seg button{cursor:pointer;padding:0 12px}.seg button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:800}
.seg.big button{height:36px;font-size:13.5px;padding:0 16px}
input::placeholder{color:var(--faint)}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ctrl .lab{font-size:11.5px;font-weight:700;color:var(--faint)}
label.ck{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px;cursor:pointer;font-weight:600}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:8px}.stats b{color:var(--text)}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:700;color:var(--faint);text-align:right;padding:6px 7px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;vertical-align:bottom;background:var(--surface)}
th:hover{color:var(--text)} th.s{color:var(--accent)}
th.grp{cursor:default;text-align:center;color:var(--sub);border-left:1px solid var(--line);padding:4px 7px 2px;font-size:10.5px}
th.grp:first-child{border-left:0}
th small{display:block;font-weight:500;font-size:10px;color:var(--faint)}
td{padding:6px 7px;border-bottom:1px solid var(--line2);text-align:right;vertical-align:top;white-space:nowrap;font-size:12.5px}
td.gb,th.gb{border-left:1px solid var(--line)}
td.n,th.n{text-align:left}
th.stk,td.stk{position:sticky;left:0;z-index:2;background:var(--surface);min-width:200px;box-shadow:1px 0 0 var(--line)}
td.n b{font-weight:700}.f{color:var(--faint);font-size:11.5px}
.up{color:var(--up)}.dn{color:var(--down)}.beat{font-weight:700}
i.t{font-style:normal;font-size:10.5px;font-weight:700;border:1px solid currentColor;border-radius:5px;padding:0 5px;margin:1px 2px;white-space:nowrap;display:inline-block;color:var(--faint)}
i.warn{color:var(--warn)} i.acc{color:var(--accent)}
.rk{color:var(--faint);font-size:11px;margin-right:6px;display:inline-block;min-width:22px}
tbody tr.row{cursor:pointer}tbody tr.row:hover td{background:var(--surface2)}tbody tr.row.sel td{background:var(--accent-soft)}
tbody tr.idx td{background:var(--surface2);color:var(--sub);font-style:italic}tbody tr.idx td.stk{color:var(--text);font-style:normal;font-weight:700}
tr.det td{background:var(--surface2);padding:12px 14px 14px;white-space:normal;cursor:default;position:static;text-align:left}
.det{position:sticky;left:14px;max-width:calc(100vw - 80px)}
.det .grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media(max-width:1150px){.det .grid{grid-template-columns:minmax(0,1fr)}}
.det table{min-width:0;font-size:12px}.det th{cursor:default;padding:4px 7px;position:static;min-width:0;box-shadow:none;background:transparent}
.det td{padding:4px 7px;position:static;min-width:0;box-shadow:none;background:transparent;font-size:12px}
.det h4{font-size:12px;color:var(--sub);margin:0 0 5px;font-weight:700}
.det svg{width:100%;height:140px;display:block;margin:4px 0 8px}.det svg text{fill:var(--sub);font-size:10px}
.det svg rect.a{fill:var(--bar)}.det svg rect.e{fill:var(--bar-e)}.det svg rect.neg{fill:var(--bar-n)}
.det svg.rkc{height:100px}.det svg.rkc polyline{fill:none;stroke:var(--accent);stroke-width:1.6}.det svg.rkc line{stroke:var(--line)}
.det .links{margin-top:10px;font-size:12px;color:var(--sub)}.det a{color:var(--accent);text-decoration:none}
.chg{background:var(--surface2);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:12.5px;color:var(--sub);line-height:1.8}
.chg b{color:var(--text)}.chg .k{color:var(--faint);font-size:11px;margin-right:6px;font-weight:700}.chg .it{display:inline-block;margin-right:10px;white-space:nowrap}
.new{color:var(--warn);font-weight:700;font-size:11px}
.more{margin-top:10px;border:1px solid var(--line);background:var(--surface);color:var(--sub);font:inherit;font-weight:600;height:32px;padding:0 14px;border-radius:9px;cursor:pointer}
ul.note{color:var(--sub);font-size:12px;padding-left:18px;display:flex;flex-direction:column;gap:3px}ul.note b{color:var(--text)}
.sc{width:100%;height:340px;display:block}.sc circle{cursor:pointer}.sc text{fill:var(--faint);font-size:10px}.sc line.ax{stroke:var(--line)}.sc line.tr{stroke:var(--warn);stroke-dasharray:4 3}
.sc circle.lo{fill:var(--down);opacity:.55}.sc circle.hi{fill:var(--faint);opacity:.45}.sc circle.sel{stroke:var(--text);stroke-width:1.5;opacity:1}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11.5px;box-shadow:var(--shadow);display:none;z-index:9}
.rkbar{display:inline-block;height:6px;background:var(--accent-soft);border-radius:3px;vertical-align:middle;margin-left:4px}
.rkbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
@media (max-width:640px){body{padding:14px 12px 48px}.card{padding:14px 12px}}
</style></head><body><div class="wrap">
<div><h1>日 밸류에이션 · 가이던스</h1><div class="sub" id="meta">불러오는 중…</div></div>
<div class="seg big" id="sec"><button data-v="top" class="on">시총 상위 × 이익 가이던스</button><button data-v="scr">저PBR × 가이던스 성장 스크리너</button></div>

<div id="secTop">
<div class="card">
 <div class="ctrl">
  <span class="lab">시장</span><div class="seg" id="mk"></div>
  <span class="lab">표시</span><div class="seg" id="tn"></div>
  <span class="lab">순위 변동</span><div class="seg" id="rb"></div>
  <label class="ck"><input type="checkbox" id="rel"> 수익률을 <span id="ixl">시장 지수</span> 대비 초과수익으로</label>
  <input id="q" placeholder="종목명·코드·업종" style="width:160px">
 </div>
 <div class="kpis" id="kpis" style="margin-bottom:12px"></div>
 <div class="chg" id="chg"></div>
 <div class="tw"><table id="tb"><thead></thead><tbody></tbody></table></div>
</div>
<div class="card"><h2>읽는 법</h2><ul class="note" id="noteTop"></ul></div>
</div>

<div id="secScr" style="display:none">
<div class="card">
 <div class="ctrl">
  <span class="lab">PBR</span><div class="seg" id="pb"></div>
  <select id="smk"><option value="">전 시장</option><option>프라임</option><option>스탠다드</option><option>그로스</option></select>
  <span class="lab">시총 ≥</span><input id="scap" type="number" value="300" step="100" style="width:80px"><span class="lab">억엔</span>
  <label class="ck"><input type="checkbox" id="pos" checked> 직전 FY·진행 FY 이익·순이익 흑자만</label>
  <label class="ck"><input type="checkbox" id="upo"> 가이던스 상향 종목만</label>
  <input id="sq" placeholder="종목명·코드·업종" style="width:160px">
 </div>
 <div class="stats" id="sstats"></div>
 <div class="ctrl" style="margin:4px 0 0"><span class="lab">산점도 X</span><select id="sx"></select><span class="lab">Y</span><select id="sy"></select><label class="ck"><input type="checkbox" id="slog" checked> Y 로그축</label><span class="f">점 크기 = 시총 · 추세선 아래(파란 점) = 같은 X 대비 PBR 낮음 · 클릭하면 표에서 펼침</span></div>
 <svg class="sc" id="sc"></svg>
 <div class="tw"><table id="stb"><thead></thead><tbody></tbody></table></div>
 <button class="more" id="smore">더 보기</button>
</div>
<div class="card"><h2>읽는 법</h2><ul class="note" id="noteScr"></ul></div>
</div>
<div class="tip" id="tip"></div>
<script>
const $=id=>document.getElementById(id);
const PKL={OP:"영업이익",OdP:"경상이익",NP:"순이익"};
const fmt=n=>n==null?"–":Math.round(n).toLocaleString();
const f1=n=>n==null?"–":(+n).toFixed(1), f2=n=>n==null?"–":(+n).toFixed(2);
const oku=v=>v==null?"–":Math.abs(v)>=1e4?(v/1e4).toFixed(1)+"조":fmt(v)+"억";
const money=v=>v==null?"–":`<span class="${v<0?"dn":""}">${fmt(v)}</span>`;
const pct=(g,fl)=>g==null?(fl?`<span class="f" style="color:var(--warn)">${fl}</span>`:"–"):`<span class="${g>0?"up":g<0?"dn":""}">${g>0?"+":""}${(+g).toFixed(1)}%</span>`;
const pp=(g)=>g==null?"–":`<span class="${g>0?"up":g<0?"dn":""}">${g>0?"+":""}${(+g).toFixed(1)}%p</span>`;
const fd=d=>d?`${d.slice(4,6)}/${d.slice(6,8)}`:"";
const fdi=d=>d?d.slice(5):"";
const med=a=>{a=a.filter(x=>x!=null).sort((x,y)=>x-y);return a.length?a[a.length>>1]:null};
const RET=[["r1m","1M"],["r3m","3M"],["r6m","6M"],["ytd","YTD"],["r1y","1Y"],["r2y","2Y"]];
const nm=(r,rank)=>`${rank!=null?`<span class="rk">${rank}</span>`:""}<b>${r.name}</b> <span class="f">${r.code}</span><br><span class="f">${r.s33||""}${r.scale?" · "+r.scale:""}${r.mkt?" · "+r.mkt:""}</span> ${r.fin&&r.pk&&r.pk!=="OP"?`<i class="t">${PKL[r.pk]} 기준</i>`:""}${r.fin===false?`<i class="t">재무 없음</i>`:(r.guide===false?`<i class="t">가이던스 없음</i>`:"")}${r.ifrs?`<i class="t">IFRS</i>`:""}`;
const links=r=>`<div class="links"><a href="https://kabutan.jp/stock/?code=${r.code}" target="_blank" rel="noopener">株探 ↗</a> · <a href="https://finance.yahoo.co.jp/quote/${r.code}.T" target="_blank" rel="noopener">Yahoo!ファイナンス ↗</a> · <a href="https://www.release.tdnet.info/inbs/I_main_00.html" target="_blank" rel="noopener">TDnet ↗</a></div>`;
let D=null,SC=null;

/* ───────── ① 시총 상위 × 이익 가이던스 ───────── */
let mk="prime",topN=50,rbase=1,sortK="mcap",sortD=-1,sel=null;
const TOPS=[50,100,150],RB=[[1,"전일"],[5,"1주 (5거래일)"],[20,"1개월 (20거래일)"]];
const T=()=>D.top[mk], rows=()=>T().rows, IDX=()=>D.index[mk]||{};
function baseDate(){const ds=T().hist.dates||[];return ds.length>rbase?ds[ds.length-1-rbase]:null}
function prevRank(code){const bd=baseDate();return bd?T().hist.rank[bd][code]:undefined}
function rkDelta(r){const p=prevRank(r.code);return p==null?null:p-r.rank}
function rkCell(r){const bd=baseDate();if(!bd)return '<span class="f">–</span>';const p=prevRank(r.code);if(p==null)return '<span class="new">NEW</span>';const d=p-r.rank;return d>0?`<span class="up">▲${d}</span>`:d<0?`<span class="dn">▼${-d}</span>`:'<span class="f">=</span>'}
const rv=(r,k)=>{const v=r[k];if(v==null)return null;const ix=IDX();return $("rel").checked&&ix[k]!=null?+(v-ix[k]).toFixed(1):v};
const retCell=(r,k)=>{const v=rv(r,k);if(v==null)return "–";const ix=IDX(),beat=!$("rel").checked&&ix[k]!=null&&r[k]>ix[k];return `<span class="${v>0?"up":v<0?"dn":""} ${beat?"beat":""}">${v>0?"+":""}${v.toFixed(1)}%</span>`};
const gi=(r,i)=>r.fin?r.op[i]:null;
const COLS=[
 ["rkd","순위 Δ<small id=\"rbl\"></small>",r=>rkDelta(r)],["mcap","시총<small>억엔</small>",r=>r.mcap],["price","주가<small>엔</small>",r=>r.price],
 ...RET.map(([k,l],i)=>[k,l,r=>rv(r,k),i===0]),
 ["op0","FY-2A",r=>gi(r,0),true],["op1","FY-1A",r=>gi(r,1)],["op2","직전 FY A",r=>gi(r,2)],["op3","진행 FY E<small>회사 가이던스</small>",r=>gi(r,3)],
 ["g1","FY-2→FY-1",r=>r.fin?r.g_op[1-1]:null,true],["g2","FY-1→직전",r=>r.fin?r.g_op[1]:null],["g3","직전→진행E",r=>r.fin?r.g_op[2]:null],
 ["rev","가이던스 수정<small>초기 → 현재</small>",r=>r.rev,true],["prog","진척률<small>누적 ÷ 가이던스</small>",r=>r.cum&&r.cum.prog!=null?r.cum.prog:null],
 ["per","PER<small>TTM</small>",r=>r.per,true],["fper","PER<small>Fwd</small>",r=>r.fper],["pbr","PBR",r=>r.pbr],["roe","ROE<small>TTM</small>",r=>r.roe],["froe","ROE<small>Fwd</small>",r=>r.froe],["dy","배당<small>예상</small>",r=>r.dy],
];
const CM=Object.fromEntries(COLS.map(c=>[c[0],c]));
const ASC=new Set(["rank","name","per","fper","pbr"]);
const val=(r,k)=>k==="name"?r.name:k==="rank"?r.rank:CM[k][2](r);
function filtered(){const q=$("q").value.trim().toLowerCase();return rows().filter(r=>r.rank<=topN&&(!q||r.name.toLowerCase().includes(q)||r.code.includes(q)||(r.s33||"").includes(q)||(r.en||"").toLowerCase().includes(q)))}
function render(){
 const R=filtered(); R.sort((a,b)=>{const x=val(a,sortK),y=val(b,sortK);if(x==null&&y==null)return a.rank-b.rank;if(x==null)return 1;if(y==null)return -1;return typeof x==="string"?x.localeCompare(y)*sortD:(x-y)*sortD});
 const rel=$("rel").checked,ix=IDX(),M=D.mkts.find(m=>m.slug===mk),bd=baseDate();
 $("ixl").textContent=M.ko+" 시장 지수";
 $("tb").querySelector("thead").innerHTML=`<tr><th class="grp stk n" rowspan="2" data-k="name">종목 <small>시총 순위 · 클릭 정렬 · 행 클릭 상세</small></th><th class="grp" colspan="3"></th><th class="grp gb" colspan="6">주가 수익률${rel?` · ${M.ko} 지수 대비 초과`:""}</th><th class="grp gb" colspan="4">이익 (억엔) · 영업이익, 없으면 경상·순이익</th><th class="grp gb" colspan="3">증가율</th><th class="grp gb" colspan="2">진행 FY 가이던스</th><th class="grp gb" colspan="6">밸류에이션 (J-Quants 산출)</th></tr>
 <tr>${COLS.map(([k,l,,gb])=>`<th class="${gb?"gb":""} ${sortK===k?"s":""}" data-k="${k}">${l}${sortK===k?(sortD>0?" ▲":" ▼"):""}</th>`).join("")}</tr>`;
 const rbl=$("rbl");if(rbl)rbl.textContent=bd?`${RB.find(x=>x[0]===rbase)[1].split(" ")[0]} ${fd(bd)} 대비`:"이력 없음";
 document.querySelectorAll("#tb thead th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortK===k)sortD=-sortD;else{sortK=k;sortD=ASC.has(k)?1:-1}render()});
 const idxRow=`<tr class="idx"><td class="stk n"><span class="rk">–</span>${M.ko} 시장 지수 <span class="f">${ix.px!=null?ix.px.toFixed(2):""}</span></td><td></td><td></td><td></td>${RET.map(([k],i)=>`<td class="${i===0?"gb":""}">${rel?"0.0%":ix[k]==null?"–":`<span class="${ix[k]>0?"up":ix[k]<0?"dn":""}">${ix[k]>0?"+":""}${ix[k].toFixed(1)}%</span>`}</td>`).join("")}<td class="gb" colspan="4" style="text-align:left;color:var(--faint)">기준일 ${fd(D.asof)} · TOPIX YTD ${D.index.topix.ytd==null?"–":(D.index.topix.ytd>0?"+":"")+D.index.topix.ytd.toFixed(1)+"%"}</td><td class="gb" colspan="3"></td><td class="gb" colspan="2"></td><td class="gb" colspan="6"></td></tr>`;
 const tb=$("tb").querySelector("tbody");
 if(!R.length){tb.innerHTML=idxRow+`<tr><td colspan="${COLS.length+1}" style="text-align:center;color:var(--faint);padding:24px">조건에 맞는 종목이 없습니다</td></tr>`;return}
 tb.innerHTML=idxRow+R.map(r=>`<tr class="row ${sel===r.code?"sel":""}" data-c="${r.code}">
  <td class="stk n">${nm(r,r.rank)}</td><td>${rkCell(r)}</td><td>${fmt(r.mcap)}</td><td>${fmt(r.price)}</td>
  ${RET.map(([k],i)=>`<td class="${i===0?"gb":""}">${retCell(r,k)}</td>`).join("")}
  <td class="gb">${money(gi(r,0))}</td><td>${money(gi(r,1))}</td><td>${money(gi(r,2))}</td><td>${r.fin&&r.guide?money(r.op[3]):'<span class="f">–</span>'}</td>
  <td class="gb">${r.fin?pct(r.g_op[0],r.f_op[0]):"–"}</td><td>${r.fin?pct(r.g_op[1],r.f_op[1]):"–"}</td><td>${r.fin&&r.guide?pct(r.g_op[2],r.f_op[2]):"–"}</td>
  <td class="gb">${r.rev!=null?pct(r.rev):r.rev_f?pct(null,r.rev_f):(r.guide?'<span class="f">유지</span>':"–")}${r.n_rev?` <span class="f">×${r.n_rev}</span>`:""}</td><td>${r.cum&&r.cum.prog!=null?`${f1(r.cum.prog)}% <span class="f">${r.cum.per}</span>`:(r.cum?`<span class="f">${r.cum.per}</span>`:"–")}</td>

 <div><h4>밸류에이션 (J-Quants, 종가 ${fmt(r.price)}엔)</h4><table><tbody><tr><th class="n">시가총액</th><td>${oku(r.mcap)}엔</td><th class="n">PBR</th><td>${f2(r.pbr)}배 <span class="f">(BPS ${fmt(r.bps)}엔)</span></td></tr>
 <tr><th class="n">PER TTM / Fwd</th><td>${f1(r.per)} / ${f1(r.fper)}배</td><th class="n">EPS TTM / Fwd</th><td>${fmt(r.eps_ttm)} / ${fmt(r.feps)}엔</td></tr>

function scatter(R){
 const xk=$("sx").value,yk=$("sy").value,lg=$("slog").checked,fx=SV[xk][1],fy=SV[yk][1];
 let P=R.map(r=>[fx(r),fy(r),r]).filter(p=>p[0]!=null&&p[1]!=null&&(!lg||p[1]>0));
 const svg=$("sc");if(P.length<3){svg.innerHTML=`<text x="20" y="30">점이 부족합니다</text>`;return}
 const qs=(a,q)=>{a=[...a].sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.floor(q*(a.length-1)))]};
 const xs=P.map(p=>p[0]),ys=P.map(p=>lg?Math.log10(p[1]):p[1]);
 const x0=qs(xs,.02),x1=qs(xs,.98),y0=qs(ys,.02),y1=qs(ys,.98);
 const W=1100,H=340,m={l:52,r:16,t:12,b:30},cl=(v,a,b)=>Math.min(b,Math.max(a,v));
 const X=v=>m.l+(cl(v,x0,x1)-x0)/((x1-x0)||1)*(W-m.l-m.r),Y=v=>m.t+(y1-cl(v,y0,y1))/((y1-y0)||1)*(H-m.t-m.b);
 // OLS 추세선 (로그축이면 로그 좌표 적합)
 const n=P.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;let sxy=0,sxx=0;P.forEach((p,i)=>{sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)**2});const sl=sxx?sxy/sxx:0,ic=my-sl*mx;
 const mcs=P.map(p=>p[2].mcap||1),mmax=Math.max(...mcs),rad=v=>3+Math.sqrt((v||1)/mmax)*14;
 const tick=(a,b,k)=>{const o=[];for(let i=0;i<=4;i++)o.push(a+(b-a)*i/4);return o.map(v=>k?(lg?Math.pow(10,v):v):v)};
 let s=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}"/><line class="ax" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${H-m.b}"/>`;
 tick(x0,x1).forEach(v=>s+=`<text x="${X(v)}" y="${H-m.b+14}" text-anchor="middle">${(+v).toFixed(Math.abs(x1-x0)<5?2:0)}</text>`);
 tick(y0,y1,1).forEach(v=>{const yy=lg?Math.log10(v):v;s+=`<text x="${m.l-5}" y="${Y(yy)+3}" text-anchor="end">${(+v).toFixed(Math.abs(y1-y0)<2?2:0)}</text>`});
 s+=`<text x="${(m.l+W-m.r)/2}" y="${H-2}" text-anchor="middle">${SV[xk][0]}</text><text transform="translate(12,${(m.t+H-m.b)/2}) rotate(-90)" text-anchor="middle">${SV[yk][0]}${lg?" (log)":""}</text>`;
 s+=`<line class="tr" x1="${X(x0)}" y1="${Y(ic+sl*x0)}" x2="${X(x1)}" y2="${Y(ic+sl*x1)}"/>`;
 P.forEach((p,i)=>{const below=ys[i]<ic+sl*xs[i];s+=`<circle class="${below?"lo":"hi"} ${ssel===p[2].code?"sel":""}" cx="${X(xs[i])}" cy="${Y(ys[i])}" r="${rad(p[2].mcap)}" data-i="${i}"/>`});
 svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML=s;
 const tip=$("tip");svg.querySelectorAll("circle").forEach(c=>{const r=P[+c.dataset.i][2];c.onmousemove=e=>{tip.style.display="block";tip.style.left=(e.clientX+12)+"px";tip.style.top=(e.clientY+12)+"px";tip.innerHTML=`<b>${r.name}</b> ${r.code}<br>${SV[xk][0]} ${f2(fx(r))} · ${SV[yk][0]} ${f2(fy(r))}<br>시총 ${fmt(r.mcap)}억엔 · 종합 ${f1(r.rk_avg)}`};c.onmouseleave=()=>tip.style.display="none";c.onclick=()=>{ssel=r.code;srender();const tr=document.querySelector(`#stb tr.row[data-c="${r.code}"]`);if(tr)tr.scrollIntoView({block:"center",behavior:"smooth"})}});
}
function sinit(){
 const mkb=(id,items,cur,set)=>{$(id).innerHTML=items.map(([k,l])=>`<button class="${String(cur)===String(k)?"on":""}" data-k="${k}">${l}</button>`).join("");$(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{set(b.dataset.k);mkb(id,items,pbrMax,set);slim=150;srender()})};
 mkb("pb",PBS,pbrMax,v=>pbrMax=+v);
 for(const id of["sx","sy"]){$(id).innerHTML=Object.entries(SV).map(([k,[l]])=>`<option value="${k}">${l}</option>`).join("")}
 $("sx").value="froe";$("sy").value="pbr";
 ["smk","scap","pos","upo","sq","sx","sy","slog"].forEach(id=>$(id).oninput=()=>{slim=150;srender()});
 $("smore").onclick=()=>{slim+=300;srender()};
 $("noteScr").innerHTML=`<li><b>유니버스</b> 도쿄증권거래소 프라임·스탠다드·그로스 보통주 중 J-Quants 가 PBR 을 산출하고 진행 회계연도 회사 가이던스(매출·이익·순이익)가 있는 종목 ${SC.n.toLocaleString()}개(보통주 ${SC.n_univ.toLocaleString()}). 기본 필터 PBR ≤ 1 · 시총 300억엔↑ · 직전 FY·진행 FY 이익과 순이익 흑자.</li>
 <li><b>일본은 증권사 컨센서스 대신 회사 가이던스</b>를 쓴다. 성장률 = 진행 FY 회사 예상 ÷ 직전 확정 FY − 1. 이익은 영업이익, 영업이익을 공시하지 않는 종합상사·은행·IFRS 사업이익 회사는 경상이익 → 순이익 순으로 대체(종목명 옆 태그).</li>
 <li><b>종합 순위</b> = 필터를 통과한 집합 안에서 매출 성장·이익 성장·순이익 성장·ROE Δ(Fwd − TTM) 네 순위의 평균. 필터를 바꾸면 다시 계산된다. 적자 전환·흑자 전환 등 비율이 무의미한 경우는 최하위.</li>
 <li><b>PBR·PER·ROE</b> 는 J-Quants 산출(PER TTM = 최근 12개월 순이익, Fwd = 진행기 회사 예상 순이익, PBR = 직전 공시 자기자본). <b>가이던스 수정</b> = 전기 결산 때 낸 초기 예상 → 현재 예상(결산 공시 안의 변경 포함, ×n = 바뀐 횟수). 상향 종목만 체크 시 +0.5% 초과.</li>
 <li><b>산점도</b> 기본 X = ROE Fwd, Y = PBR(로그). 점선 = 최소제곱 추세선, 그 아래 파란 점 = 같은 ROE 수준 대비 PBR 이 낮은 종목. 2~98% 밖 값은 가장자리에 고정. 점 크기 = 시총.</li>
 <li><b>갱신</b> 평일 17:15 자동(J-Quants 밸류에이션 16:30 반영 후). 決算短信 데이터는 매일 00:30 확정 CSV 를 07:30 에 동기화(결산 시즌 당일 저녁 속보는 다음날 아침 반영).</li>`;
}

 <li><b>가이던스 수정</b> = 전기 결산 때 낸 진행 FY 초기 예상 → 현재 예상의 변화율(×n = 값이 바뀐 횟수, 결산 공시 안의 수정 포함). <b>진척률</b> = 최근 분기 누적 이익 ÷ 통기 가이던스(1Q 25%·2Q 50%·3Q 75% 가 기준선).</li>
